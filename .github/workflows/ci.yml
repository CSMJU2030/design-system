name: ci

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build
      - name: design system ตรวจตัวเอง
        run: npm run lint:self

      # ยืนยันว่า package ใช้ได้จริงใน Next.js App Router ไม่ใช่แค่ build ผ่าน
      # (เคยเจอบั๊กที่ "use client" หายตอน bundle แล้ว next build พังตอน collect page data)
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: integration — build ตัวอย่างระบบย่อยจริง (pnpm + Tailwind v3 + frontend/)
        run: |
          npm pack --pack-destination /tmp
          cd examples/subsystem-template/frontend
          export TGZ=$(ls /tmp/csmju2030-design-system-*.tgz)
          node -e "
            const fs=require('fs'); const p='package.json';
            const d=JSON.parse(fs.readFileSync(p,'utf8'));
            d.dependencies['@csmju2030/design-system']='file:'+process.env.TGZ;
            fs.writeFileSync(p, JSON.stringify(d,null,2));
          "
          pnpm install --no-frozen-lockfile
          pnpm run build
          pnpm run lint
          pnpm run typecheck
        env:
          NEXT_PUBLIC_CSMJU_CORE_URL: https://core.csmju2030.ac.th
          NEXT_PUBLIC_API_BASE_URL: https://api.csmju2030.ac.th

      - name: integration — csmju-ui-lint ต้องเขียวกับ template
        run: cd examples/subsystem-template && node ../../tools/csmju-ui-lint.mjs
